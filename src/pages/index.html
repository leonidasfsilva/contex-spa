<!doctype html>
<html lang="pt-BR">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Contex SPA</title>
        <meta
            name="description"
            content="Interface moderna do Contex para gestão financeira."
        />
        <link
            rel="icon"
            href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%2310b981' stroke-width='2.5' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpolygon points='13 2 3 14 12 14 11 22 21 10 12 10 13 2'/%3E%3C/svg%3E"
        />
        <script>
            ;(() => {
                try {
                    const preference = localStorage.getItem('apex-theme') || 'system'
                    const dark =
                        preference === 'dark' ||
                        (preference === 'system' &&
                            window.matchMedia('(prefers-color-scheme: dark)').matches)
                    const root = document.documentElement

                    root.classList.toggle('dark', dark)
                    root.style.colorScheme = dark ? 'dark' : 'light'
                } catch {
                    // The application remains usable when storage is unavailable.
                }
            })()
        </script>
        <script type="module" crossorigin src="/assets/icons-CvCjpvea.js"></script>
        <script type="module" crossorigin src="/assets/toast-CYCf26qJ.js"></script>
        <script type="module" crossorigin src="/assets/tabs-CD3ADGpv.js"></script>
        <script type="module" crossorigin src="/assets/main-CaHxEhGx.js"></script>
        <link rel="stylesheet" crossorigin href="/assets/icons-eA5UIe3R.css" />
        <script type="module" src="/components/sidebar.js"></script>
    </head>
    <body>
        <div id="app"></div>
        <script type="module" src="/src/main.js"></script>
    </body>
</html>
